<!DOCTYPE html>
<html lang="en">
    <!--The head is where we store metadata-->
    <!--(data that is about the content, not part of it)-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>About Me</title>
    </head>
    <!--The body is where content goes (stuff you see)-->
    <body>
        <p>Hello</p>
        <p>My name is Dan</p>
    </body>
</html>
